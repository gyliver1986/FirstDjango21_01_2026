{% extends "base.html" %}
{% block title %}
    <title>item_page</title>
{% endblock %}
    
{% block content %}    
<h2> Имя: {{ item.name }}</h2>
    <div>
        <p> Количество: {{ item.count | default:"товар отсутствует "}}</p>
    </div>

    <div><p>Бренд: {{ item.brand }} </p></div>
    <br>
    <hr>
    <h3>Цвета</h3> 
    {% for color  in colors  %}
        {{ color }} <br>
    {% endfor %}  
    <p> <a href="{% url "items-list" %}"> Назад к списку товара</a></p>

{% endblock %}
