{% extends "base.html" %}

{% block title %}
    <title>Items list</title>
{% endblock %}


{% block content %}
    <h1> Список товаров </h1>
    <div class="items">
        {% for item in items %}
            <div class="item">
                <a href='/item/{{ item.id }}'> 
                    <p class="item_name">{{ item.name }}  </p>
                    <p style="color: orange">Описание товара:</p>
                    <p>{{ item.description }} </p>
                </a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
